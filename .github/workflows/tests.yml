name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (legacy peer deps to avoid CI ERESOLVE)
        run: npm ci --legacy-peer-deps

      - name: Run tests (deterministic, mock adapter)
        env:
          ENABLE_MOCK_ADAPTER: 'true'
        run: |
          npm test -- --run

      - name: Upload vitest junit results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-report-*.xml
