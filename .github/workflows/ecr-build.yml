name: Build and Push (GovCloud)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-gov-west-1
      ECR_REPO: 465947697623.dkr.ecr.us-gov-west-1.amazonaws.com/orca-router
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC → GovCloud)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GOVCLOUD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Who am I? (debug)
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Optional: sync generated assets from S3
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${ASSETS_S3_URI:-}" ]; then
            echo "No ASSETS_S3_URI secret provided — skipping asset sync."
          else
            echo "Syncing generated assets from $ASSETS_S3_URI into attached_assets/"
            mkdir -p attached_assets
            aws s3 sync "$ASSETS_S3_URI" attached_assets/ --only-show-errors || {
              echo "aws s3 sync failed" >&2
              exit 1
            }
            echo "Asset sync complete. Listing synced files:"
            ls -la attached_assets | sed -n '1,200p' || true
          fi

      - name: 'CI pre-check: install Node and run build (fast-fail)'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Run npm install and build (fast-fail)'
        run: |
          set -euo pipefail
          echo "Running fast-fail build on runner to catch errors early"
          npm ci --legacy-peer-deps --include=dev
          npm run build

      - name: "Diagnostic: list attached_assets on runner"
        if: ${{ always() }}
        run: |
          echo "Reporting attached_assets contents (first 200 entries)"
          ls -la attached_assets | sed -n '1,200p' || echo "attached_assets directory missing on runner"
          echo "Count:" $(ls -1 attached_assets 2>/dev/null | wc -l || echo 0)

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --debug

      - name: Build, tag, and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_TAG="${IMAGE_TAG::7}"

          echo "ECR repo: $ECR_REPO"

          # Ensure ECR repo exists
          REPO_NAME=$(echo "$ECR_REPO" | awk -F/ '{print $2}')
          ACCOUNT_AND_REG=$(echo "$ECR_REPO" | awk -F/ '{print $1}')

          if ! aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$REPO_NAME" --region "$AWS_REGION" || true
          fi

          # Build and push with buildx
          docker buildx build --platform linux/amd64 --tag "$ECR_REPO:$SHORT_TAG" --tag "$ECR_REPO:latest" --push .
