name: Build and Push (GovCloud)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-gov-west-1
      ECR_REPO: 465947697623.dkr.ecr.us-gov-west-1.amazonaws.com/orca-router
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC → GovCloud)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-us-gov:iam::465947697623:role/github-actions-ecr-pusher
          aws-region: us-gov-west-1
          audience: sts.amazonaws.com

      - name: Who am I? (debug)
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t "$ECR_REPO:$TAG" .
          docker tag "$ECR_REPO:$TAG" "$ECR_REPO:latest"
          docker push "$ECR_REPO:$TAG"
          docker push "$ECR_REPO:latest"
